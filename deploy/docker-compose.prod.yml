# Production compose file. Shipped to the server by the deploy workflow.
# Uses images published to GHCR by the build-and-push job; every value comes
# from the .env file the workflow writes alongside this file.

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy

  storefront:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/storefront:${IMAGE_TAG}
    restart: unless-stopped
    depends_on: [backend]

  admin:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/admin:${IMAGE_TAG}
    restart: unless-stopped
    depends_on: [backend]

  proxy:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/proxy:${IMAGE_TAG}
    restart: unless-stopped
    depends_on: [backend, storefront, admin]
    ports:
      - "${PROXY_PORT:-80}:80"

volumes:
  db_data:
