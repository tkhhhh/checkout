upstream backend    { server backend:8080; }
upstream storefront { server storefront:80; }
upstream admin      { server admin:80; }

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80;
    server_name store.brisksailhealth.com;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name store.brisksailhealth.com;

    ssl_certificate     /etc/letsencrypt/live/store.brisksailhealth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.brisksailhealth.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 4m;

    # Shared proxy headers used by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Proxy health.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Go backend (keep the /api prefix — backend routes are mounted at /api).
    location /api/ {
        proxy_pass http://backend;
    }

    # Redirect bare /admin to /admin/ so relative asset URLs resolve.
    location = /admin { return 301 /admin/; }

    # Admin SPA — strip the /admin/ prefix before forwarding. Vite base and
    # React Router basename are both '/admin/' so links and assets stay valid.
    location /admin/ {
        proxy_pass http://admin/;
    }

    # Storefront SPA (default).
    location / {
        proxy_pass http://storefront/;
    }
}
