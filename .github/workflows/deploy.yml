name: deploy
#
# Builds all service images, pushes them to GHCR, and deploys via SSH to a
# server that has docker + docker compose installed.
#
# Required secrets (Settings → Environments → production → secrets):
#   DEPLOY_SSH_HOST      hostname or IP of the server
#   DEPLOY_SSH_USER      user with docker access (member of the docker group)
#   DEPLOY_SSH_KEY       private key (whole file) authorised on the server
#   DEPLOY_PATH          directory on the server, e.g. /opt/checkout
#   POSTGRES_PASSWORD    Postgres password for the checkout DB
#   JWT_SECRET           JWT signing secret for the backend
#   ADMIN_PASSWORD       Password seeded (upserted) for admin@example.com on boot
#
# Optional secrets:
#   DEPLOY_SSH_PORT      SSH port (default 22)
#   PROXY_PORT           public port the nginx proxy binds on the host (default 80)
#   ALLOWED_ORIGINS      backend CORS allowlist (default http://$DEPLOY_SSH_HOST)
#
# One-time server setup (CentOS / RHEL / Rocky / Alma — Stream 8+):
#   sudo bash deploy/bootstrap-centos.sh <deploy-user> <deploy-path>
# (installs docker-ce + compose plugin from the official repo, enables the
# service, opens firewalld port 80/tcp, adds the user to the docker group,
# and creates $DEPLOY_PATH.)
#
# Then add the deploy key's public half to
#   /home/<deploy-user>/.ssh/authorized_keys
# and populate the secrets above.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: storefront
            context: ./storefront
          - service: admin
            context: ./admin
          - service: proxy
            context: ./proxy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY:  ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Generate .env
        env:
          REGISTRY:          ${{ env.REGISTRY }}
          IMAGE_NAMESPACE:   ${{ env.IMAGE_NAMESPACE }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET:        ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD:    ${{ secrets.ADMIN_PASSWORD }}
          PROXY_PORT:        ${{ secrets.PROXY_PORT }}
          ALLOWED_ORIGINS:   ${{ secrets.ALLOWED_ORIGINS }}
          DEPLOY_SSH_HOST:   ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          umask 077
          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          cat > .env.deploy <<EOF
          REGISTRY=$REGISTRY
          IMAGE_NAMESPACE=$IMAGE_NAMESPACE
          IMAGE_TAG=$IMAGE_TAG
          POSTGRES_DB=checkout
          POSTGRES_USER=checkout
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
          JWT_SECRET="$JWT_SECRET"
          ADMIN_PASSWORD="$ADMIN_PASSWORD"
          JWT_TTL_HOURS=24
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://$DEPLOY_SSH_HOST}
          PROXY_PORT=${PROXY_PORT:-80}
          EOF

      - name: Copy files to server
        env:
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEST:     ${{ secrets.DEPLOY_PATH }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy -p ${SSH_PORT:-22}"
          SCP="scp -i $HOME/.ssh/id_deploy -P ${SSH_PORT:-22}"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$DEST'"
          $SCP deploy/docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$DEST/docker-compose.yml"
          $SCP deploy/remote-deploy.sh       "$SSH_USER@$SSH_HOST:$DEST/remote-deploy.sh"
          $SCP .env.deploy                   "$SSH_USER@$SSH_HOST:$DEST/.env"

      - name: Deploy
        env:
          SSH_USER:   ${{ secrets.DEPLOY_SSH_USER }}
          SSH_HOST:   ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT:   ${{ secrets.DEPLOY_SSH_PORT }}
          DEST:       ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER:  ${{ github.actor }}
        run: |
          # Token is piped over stdin so it never appears in `ps` on the server.
          printf '%s\n' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/id_deploy" -p "${SSH_PORT:-22}" \
            "$SSH_USER@$SSH_HOST" \
            "cd '$DEST' && chmod 600 .env && GHCR_USER='$GHCR_USER' bash remote-deploy.sh"

      - name: Summary
        run: |
          echo "### Deployed" >> $GITHUB_STEP_SUMMARY
          echo "Tag: \`sha-${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "Host: \`${{ secrets.DEPLOY_SSH_HOST }}\`" >> $GITHUB_STEP_SUMMARY
